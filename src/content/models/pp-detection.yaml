id: pp-detection
name: PaddleDetection PicoDet / PP-YOLOE
brand: baidu
task: detection
status: available
summary: 在浏览器本地运行 PicoDet-L-320 与 PP-YOLOE+ S 640 稳定模型，支持图片、摄像头和视频帧；默认 PicoDet，两个模型均默认 ModelScope。
repository: https://github.com/chenmohan123/web-sdk-PP-Detection
license: Apache-2.0
package:
  name: web-sdk-pp-detection
  version: 0.3.1
demo:
  url: https://chenmohan123.github.io/web-sdk-PP-Detection/
  localProcessing: true
runtime:
  backends:
    - { name: wasm, status: stable }
    - { name: webgpu, status: stable }
  capabilities: [worker, checksum, model-cache, image, camera, video, multi-source, fp32]
  verifiedEnvironments:
    - { browser: Chromium 153, os: Windows 11, device: Intel Core i5-10400F / WASM，两个模型, testedAt: 2026-09-12 }
    - { browser: Chromium 153, os: Windows 11, device: NVIDIA Blackwell / WebGPU，两个模型, testedAt: 2026-09-12 }
io:
  input: [Blob, Canvas, CanvasImageSource, ImageBitmap, HTMLVideoElement, VideoFrame]
  output: [bounding boxes, labels, scores]
assets:
  - id: picodet-l-320-fp32
    precision: fp32
    bytes: 23243834
    url: https://www.modelscope.cn/models/chenmohan/web-sdk-pp-detection/resolve/852b3acbb768705c77359362546eae9999f4190c/picodet-l-320-fp32.onnx
    sha256: 0397bb449689d1bf57dfcb8849b3ddaa1c8962e1e63e533bd97d265908a428a1
  - id: ppyoloe-plus-s-640-fp32
    precision: fp32
    bytes: 31954220
    url: https://www.modelscope.cn/models/chenmohan/web-sdk-pp-detection/resolve/af865f1c515634de08fe0fc5eeeac8942456241c/ppyoloe-plus-s-640/0.1.0-labs.1/ppyoloe-plus-s-640-fp32.onnx
    sha256: d3ae6a9f75311e7a05b535c4c0d4a1cdaad6342f87a0339cef5b4e52b106749c
limitations:
  - FP16、INT8、INT4 和 FP8 尚未达到稳定发布门槛，本目录仅登记 FP32 变体。
  - 2026-09-12 小米 15 Android Edge 152 用户确认两款模型 CPU/GPU 基础回归正常；截图直接确认 PP-YOLOE WebGPU/FP32/main，实际系统版本未知，其他移动设备和微信 WebView 尚未验证。
  - 0.3.1 优化共用预处理；本机 PP-YOLOE WebGPU 三轮热端到端中位数降低 25.5%，不代表手机或其他设备的加速比例。
  - PP-YOLOE 的质量评测来自固定 64 张 COCO 子集，不代表全量 COCO mAP；完整验证记录见 SDK 0.3.1 Release。
  - PP-YOLOE 稳定清单复用既有 0.1.0-labs.1 目录中的相同模型字节；模型状态以 v0.3.0 的固定清单为准。
  - 微信原生小程序不支持 JavaScript/WASM runtime。
  - 多线程 WASM 依赖跨域隔离（COOP/COEP）；未满足时应使用单线程模式。
