limitations:
  - PP-YOLO Tiny 320 当前稳定版本0.1.0（FP32）与0.1.1（FP32+FP16）；保留0.1.0 FP32来源，新增FP16为2.36MB，固定64图三轮同后端对照AP为22.5276/22.4235（CPU/GPU），热推理53.005/37.130ms，仅体现体积优势，不承诺加速。FP16已通过本轮门槛并进入稳定目录；W8A32为1.57MB但最差AP下降0.537364点超过0.5点，继续保留labs。双Hub、CPU/GPU与main/Worker八组合验证通过，不新增手机或NPU兼容声明。当前评测证据：https://github.com/chenmohan123/web-sdk-PP-Detection/blob/7516d394be79533fdf4980fab8c02cb198e95d97/reports/evaluation/2026-09-16-tiny-precision/README.md；原0.1.0发布证据：https://github.com/chenmohan123/web-sdk-PP-Detection/blob/7516d394be79533fdf4980fab8c02cb198e95d97/reports/distribution/2026-09-15-ppyolo-tiny/README.md；本轮分发证据：https://github.com/chenmohan123/web-sdk-PP-Detection/blob/7516d394be79533fdf4980fab8c02cb198e95d97/reports/distribution/2026-09-16-tiny-precision/README.md
  - PicoDet 本轮新增8个FP16和6个W8A32，通过三轮 × WASM/WebGPU × 固定64图的逐规格FP32对照。AP下降≤0.5点、score≥0.5/同类IoU≥0.5一对一保留率≥95%；XS-320/416 W8A32最低保留率94.38%/94.12%，保留labs。FP16文件减少约35%–36%，达标W8A32约71%–74%，不代表普遍加速或内存同比减少。证据：https://github.com/chenmohan123/web-sdk-PP-Detection/tree/cdf15b14ea20b3c09adbc76c65a0cbe41ceaf443/reports/evaluation/2026-09-15-picodet-series-precision
  - PP-YOLOE+ S/M/L/X 当前清单均为 0.1.1；PicoDet-L 320 为 1.0.2，新增 PicoDet XS/S/M 320/416 与 L 416/640 为 1.0.1；XS-320/416 提供 FP32、FP16，其余 PicoDet 规格提供 FP32、FP16、W8A32。所有规格仅提供 ModelScope 与 Hugging Face，默认 ModelScope，显式来源失败不会静默换源。发布证据：https://github.com/chenmohan123/web-sdk-PP-Detection/blob/f6d79e4b51125c491eecd48bf7efd745ff5d3c9f/reports/distribution/2026-09-14-ppyoloe-mlx-precision/README.md
  - M/L/X 三规格三精度在固定64图、716标注子集上完成54组浏览器运行；新增六变体 AP 最大下降 0.348 个百分点，常规识别保留率至少 97.43%。门槛为 AP下降≤0.5点、score≥0.5/同类IoU≥0.5保留≥95% FP32检测；IoU≥0.99仅诊断。不代表全量 COCO mAP。
  - 新增六变体完成 WASM/WebGPU × main/Worker 共24组生命周期验证；预取消后可恢复，释放后禁止检测。FP16文件约缩小50%、W8A32约75%，但CPU仍为秒级；需要接近原始框坐标时选择FP32。
  - SDK 0.4.0 增加默认关闭的小目标增强实验策略，可能增加误检和耗时；不等同于 PP-YOLOE-SOD 模型。本次模型与 Demo 更新没有修改 runtime API，也不另发 npm 版本。
  - 四规格来自同一固定 PaddleDetection 提交和官方 COCO 权重，沿用 S 的 Apache-2.0 发布口径并保留上游 LICENSE、归因和转换说明。两个 Hub 均为本项目维护的转换镜像，未发现按规格不同的许可或独立权重许可文件。
  - SDK 0.3.2 增加 ONNX 权重下载超时、取消和有限同源重试，默认总时限 180 秒、无新增字节 30 秒、最多重试 2 次；清单 JSON 不使用此策略。
  - W8A32 的精度标识为 int8，表示权重 INT8 存储、激活与卷积计算 FP32；体积缩小不代表推理速度或运行内存同比改善。FP16 保留敏感算子 FP32，INT4 和 FP8 尚未稳定发布。
  - 2026-09-12 小米 15 Android Edge 152 用户确认两款模型 FP32 CPU/GPU 基础回归正常；FP16 和 W8A32 尚无手机实测证据，实际系统版本未知，其他移动设备和微信 WebView 尚未验证。
  - 0.3.1 优化共用预处理；本机 PP-YOLOE WebGPU 三轮热端到端中位数降低 25.5%，不代表手机或其他设备的加速比例。
  - 两款模型三种精度已完成 2026-09-12 桌面 WASM/WebGPU 三轮验证，质量评测使用固定 64 张 COCO 图片及 716 个标注，不代表全量 COCO mAP。对比报告：https://github.com/chenmohan123/web-sdk-PP-Detection/blob/2bf1bc23f3f48023e28affbf86ff73ae0a54ade2/reports/evaluation/2026-09-12-precision-variants/README.md
  - 微信原生小程序不支持 JavaScript/WASM runtime。
  - 多线程 WASM 依赖跨域隔离（COOP/COEP）；未满足时应使用单线程模式。
