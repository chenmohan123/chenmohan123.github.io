id: pp-rotated-detection
name: PP-RotatedDetection
brand: baidu
task: rotated-detection
status: available
summary: 在浏览器本地运行 PP-YOLOE-R-s 1024 FP32 单帧旋转框检测，识别 DOTA 15 类遥感目标，返回原图坐标系的类别、分数与四点框。
repository: https://github.com/chenmohan123/web-sdk-PP-RotatedDetection
license: Apache-2.0
package:
  name: web-sdk-pp-rotated-detection
  version: 0.1.0
demo:
  url: https://chenmohan123.github.io/web-sdk-PP-RotatedDetection/
  localProcessing: true
runtime:
  backends:
    - { name: wasm, status: stable }
    - { name: webgpu, status: stable }
  capabilities: [worker, checksum, model-cache, scoped-cache-clear, cache-estimate, image, multi-source, fp32, rotated-box]
  verifiedEnvironments:
    - browser: Chromium 153.0.8010.12，主线程与 Worker
      os: Windows 11 10.0.26200
      device: Intel Core i5-10400F / WASM，ModelScope/Hugging Face
      testedAt: 2026-09-18
    - browser: Chromium 153.0.8010.12，主线程与 Worker
      os: Windows 11 10.0.26200
      device: NVIDIA GeForce RTX 5060 Ti / WebGPU，驱动 32.0.16.1692，ModelScope/Hugging Face
      testedAt: 2026-09-18
io:
  input: [Blob, RGBA]
  output: [DOTA 15 类类别与分数, 原图坐标系四点框, image, runtime, model, timings]
assets:
  - id: ppyoloe-r-s-1024-fp32
    precision: fp32
    bytes: 33161415
    url: https://www.modelscope.cn/models/chenmohan/web-sdk-pp-rotated-detection/resolve/20632e3f350c664c2f88ea56b68bca0fe8a03349/ppyoloe-r-s-1024/0.1.0/ppyoloe-r-s-1024-fp32.onnx
    sha256: de2f4c94061bda4bfaa0773ed5bc3aabdc59cf5b2f72301d15ae500b8f971089
limitations:
  - 当前 SDK 与 Demo 只处理单张图片，不包含大图切片、视频、摄像头、跨帧跟踪或门户组合；输出是每张图的旋转框，不是轨迹 ID。
  - 类别固定为 DOTA 15 类遥感目标，不是 COCO 通用检测；四点框按原图坐标返回，不能直接替代轴对齐 Detection SDK。
  - 默认 ModelScope，另可显式选择 Hugging Face；双源固定提交、字节数与 SHA-256 已验证。显式来源或后端失败不会静默切换，npm 包不内置 ONNX。
  - 2026-09-18 双源 × WASM/WebGPU × 主线程/Worker 八组合已通过正式 HTTPS Demo 验收，npm 0.1.0 与 GitHub Release 已发布；固定证据见 https://github.com/chenmohan123/web-sdk-PP-RotatedDetection/tree/b54ae15ca124fd111cac6e683409fdbb88a14e13/reports/2026-09-18-release 。
  - 固定五输入的转换阶段数值对照最差旋转 IoU 为 0.9993547，正式 Demo 的 P0861 图片八组合均得到 136 框；这些结果不是全量 DOTA mAP，也不代表其他图片或设备精度。
  - 当前仅提供 FP32，SDK 接受合法图片并还原原图坐标，模型推理尺寸固定为 1024×1024，图片输入上限为 16,777,216 像素。
  - SDK、官方代码与转换权重按 Apache-2.0 采用并保留 PaddleDetection 归因；未发现独立点名权重的许可文本，采用依据与原始 LICENSE/NOTICE 见固定发布证据。
  - 验证限于记录中的 Windows/Chromium 桌面环境，手机、NPU、Safari、Firefox 和微信 web-view 尚未验证。
