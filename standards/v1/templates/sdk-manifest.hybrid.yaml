schemaVersion: "1.3.0"
kind: hybrid
id: example-tracking-with-reid
name: 浏览器跟踪与可选 ReID 示例
summary: 框架无关的浏览器跟踪算法，另提供不会由默认入口加载的可选 ReID 模型子入口。
package:
  name: web-sdk-example-tracking
  version: 0.1.0
repository: https://github.com/owner/web-sdk-example-tracking
demo:
  url: https://owner.github.io/web-sdk-example-tracking/
  defaultLanguage: zh-CN
  framework: react
  localProcessing: true
docs:
  zhCN: docs/zh-CN/quick-start.md
  en: docs/en/quick-start.md
runtime:
  backends: [cpu, wasm]
  executionModes: [main, worker]
  actualBackendReported: true
  runtimeVersion: example-tracking@0.1.0+onnxruntime-web@1.0.0
algorithm:
  id: example-tracking
  version: 0.1.0
  family: 多目标跟踪
  source: 独立实现；请替换为论文、代码来源和实现差异的说明或文档路径
  license: Apache-2.0
  input: docs/zh-CN/api.md#tracking-frame
  output: docs/zh-CN/api.md#tracking-result
  stateful: true
model:
  id: example-reid
  version: 0.1.0
  format: onnx
  parameterCount: 1000
  precision: [fp32]
  source: https://github.com/owner/example-reid
  license: Apache-2.0
  defaultVariant: fp32
  defaultSource: custom
  assets:
    - id: fp32
      bytes: 1000
      precision: fp32
      url: https://example.com/models/example-reid.onnx
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  variants:
    - id: fp32
      precision: fp32
      quantization: null
      opset: 17
      bytes: 1000
      parameterCount: 1000
      backends: [wasm]
      sources:
        - kind: custom
          repository: https://example.com/example-reid
          revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          path: models/example-reid.onnx
          downloadUrl: https://example.com/models/example-reid.onnx
          bytes: 1000
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
performance:
  timings: [validationMs, predictionMs, associationMs, updateMs, modelDownloadMs, modelCacheReadMs, integrityMs, sessionMs, inferenceMs, totalMs]
  coldStartDefined: true
  warmRunDefined: true
cache:
  storage: [indexeddb]
  versionedKeys: true
  clearCurrent: true
  clearAll: true
  estimate: true
modules:
  algorithm:
    entry: "."
    runtime:
      backends: [cpu]
      executionModes: [main]
      actualBackendReported: true
      runtimeVersion: example-tracking@0.1.0
    performance:
      timings: [validationMs, predictionMs, associationMs, updateMs, totalMs]
      coldStartDefined: true
      warmRunDefined: true
  model:
    entry: ./reid
    optional: true
    runtime:
      backends: [wasm]
      executionModes: [worker]
      actualBackendReported: true
      runtimeVersion: onnxruntime-web@1.0.0
    performance:
      timings: [modelDownloadMs, modelCacheReadMs, integrityMs, sessionMs, inferenceMs, totalMs]
      coldStartDefined: true
      warmRunDefined: true
examples:
  vanilla: { status: available, path: examples/vanilla }
  react: { status: available, path: examples/react }
verification:
  environments:
    - { browser: Chrome 151, os: Windows 11, device: 示例设备, testedAt: 2026-09-21, module: algorithm, backend: cpu, runtimeVersion: example-tracking@0.1.0 }
    - { browser: Chrome 151, os: Windows 11, device: 示例设备, testedAt: 2026-09-21, module: model, backend: wasm, runtimeVersion: onnxruntime-web@1.0.0 }
