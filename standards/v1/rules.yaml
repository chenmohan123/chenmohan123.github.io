standardVersion: "1.2.0"
rules:
  - id: META-001
    level: required
    detector: manifestPresent
    message: SDK manifest is present and declares the v1 contract
    remediation: Copy standards/v1/templates/sdk-manifest.yaml and fill every required field.
  - id: META-002
    level: required
    detector: packageMetadata
    message: package.json declares a public package identity and version
    remediation: Add a non-private package with a semver version and repository metadata.
  - id: DOC-001
    level: required
    detector: bilingualReadme
    message: Chinese-default and English README files link to one another
    remediation: Add README.md and README.en.md with reciprocal language links.
  - id: DOC-002
    level: required
    detector: bilingualDocs
    message: Chinese and English documentation directories are present
    remediation: Provide equivalent docs/zh-CN and docs/en quick-start/API guidance.
  - id: DOC-003
    level: required
    detector: publicLinks
    message: README or package metadata exposes GitHub, npm, and live Demo links
    remediation: Add repository, package, and Demo URLs to README and manifest.
  - id: DEMO-001
    level: required
    detector: demoEntry
    message: A runnable standalone Demo entry exists
    remediation: Add a Demo app with a documented start/build command.
  - id: DEMO-002
    level: required
    detector: demoChineseDefault
    message: Demo declares Chinese as its initial language
    remediation: Set lang or default language state to zh-CN.
  - id: DEMO-003
    level: required
    detector: demoLanguageToggle
    message: Demo provides an in-page Chinese/English toggle
    remediation: Add a language toggle that does not alter inference state.
  - id: DEMO-004
    appliesTo: [model]
    level: required
    detector: demoCacheClear
    message: Demo exposes current-model and global cache cleanup controls
    remediation: Wire clear-current and clear-all actions to the SDK cache API.
  - id: DEMO-005
    level: required
    detector: demoTimingMarkers
    message: Demo 展示当前模型或算法的信息、运行信息和耗时
    remediation: 模型使用 data-sdk-model-info，算法使用 data-sdk-algorithm-info；两者保留 data-sdk-runtime-info 和 data-sdk-timing。
  - id: DEMO-006
    appliesTo: [algorithm]
    level: required
    detector: demoStateReset
    message: 算法 Demo 提供状态复位操作
    remediation: 使用 data-sdk-state-reset 标记复位控件，并按状态生命周期契约连接 reset。
  - id: ALGORITHM-001
    appliesTo: [algorithm]
    level: required
    detector: algorithmInformation
    message: 算法清单声明身份、家族、来源、许可、输入输出与有状态语义
    remediation: 按 sdk-manifest.algorithm.yaml 填写 algorithm 字段并记录状态生命周期。
  - id: MODEL-001
    appliesTo: [model]
    level: required
    detector: modelInformation
    message: Manifest declares model identity, precision, size, source, license, and checksum
    remediation: Complete the model and asset fields in sdk-manifest.yaml.
  - id: RUNTIME-001
    level: required
    detector: runtimeInformation
    message: Requested/actual backend and execution mode are declared
    remediation: Add runtime backends, execution modes, and actual backend reporting.
  - id: PERF-001
    level: required
    detector: performanceTimings
    message: 声明当前 SDK 类型所需的标准耗时字段
    remediation: 模型保留下载、缓存、校验、会话、推理和总耗时；算法声明 validationMs、predictionMs、associationMs、updateMs、totalMs。
  - id: CACHE-001
    appliesTo: [model]
    level: required
    detector: cacheContract
    message: Cache storage, versioning, estimate, and cleanup are declared
    remediation: Add cache contract fields and expose cleanup controls in the Demo.
  - id: EXAMPLE-001
    level: required
    detector: vanillaExample
    message: Vanilla TypeScript/DOM portability example exists
    remediation: Add examples/vanilla with a runnable README.
  - id: EXAMPLE-002
    level: required
    detector: reactExample
    message: React reference example exists
    remediation: Add examples/react or explicitly record a migration exception.
  - id: EXAMPLE-003
    level: recommended
    detector: declaredExamples
    message: Declared target surfaces have runnable examples or explicit unsupported status
    remediation: Align examples with manifest target surfaces.
  - id: RELEASE-001
    level: required
    detector: ciWorkflow
    message: CI workflow runs verification before release
    remediation: Add .github/workflows/ci.yml with tests, typecheck, and build.
  - id: RELEASE-002
    level: required
    detector: releaseWorkflow
    message: GitHub Release workflow exists
    remediation: Add a tag-triggered release workflow and publish notes.
  - id: RELEASE-003
    level: recommended
    detector: changelog
    message: Changelog documents user-visible SDK and Demo changes
    remediation: Add CHANGELOG.md with the current release entry.
  - id: GOV-001
    level: required
    detector: githubDefaultBranchRuleset
    verification: github-api
    message: The default branch has an active least-privilege Ruleset for pull requests, current CI checks, resolved conversations, deletion, and force-push protection
    remediation: Configure an active default-branch Ruleset using standards/v1/repository-governance-contract.md and capture dated GitHub API evidence.
  - id: GOV-002
    level: required
    detector: githubReleaseTagRuleset
    verification: github-api
    appliesWhen: release-tags
    message: Release tags are immutable under an active tag Ruleset
    remediation: Protect the documented release tag pattern against updates and deletion, minimize bypass, and capture dated GitHub API evidence.
  - id: DEPLOY-001
    level: required
    detector: remoteDemoDeployment
    verification: remote-api
    appliesWhen: live-demo
    message: The live Demo has a reproducible HTTPS deployment from protected source with least-privilege credentials
    remediation: Configure and verify a deployment that meets standards/v1/repository-governance-contract.md, then record its commit and deployment evidence.
  - id: PAGES-001
    level: required
    detector: githubPagesDeployment
    verification: github-api
    appliesWhen: github-pages
    message: A GitHub Pages Demo deploys through GitHub Actions with scoped permissions, environment binding, HTTPS, and concurrency control
    remediation: Configure Pages and its deployment workflow using standards/v1/repository-governance-contract.md and capture dated GitHub API evidence.
  - id: UI-001
    level: recommended
    detector: uiTokens
    message: Demo styling references the shared token vocabulary
    remediation: Import or copy standards/v1/ui-tokens.json values without introducing conflicting status colors.
  - id: LABS-001
    level: labs
    detector: labsDisclosure
    message: Experimental backends and NPU claims have explicit evidence and limits
    remediation: Mark WebNN/NPU as labs unless a dated verification matrix exists.
